services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      # ホスト側は5432が別プロジェクトで使用中のため5433を使う(コンテナ内部は5432のまま)
      - "5433:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      # DBが実際に接続を受け付けられる状態になるまでbackendの起動を待たせるためのチェック
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 2s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    ports:
      - "8000:8000"
    volumes:
      # ソースコードをコンテナにマウントし、保存したら即座に反映されるようにする(ホットリロード)
      - ./backend/app:/app/app
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
